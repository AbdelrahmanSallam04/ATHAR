<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — ATHAR Impact Platform</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-container fade-in">
      
      <!-- Brand Header -->
      <div class="auth-header">
        <div class="brand-mark">أثر</div>
        <h1 class="brand-title">ATHAR</h1>
        <p class="brand-sub">Non-Profit Management & Impact Platform</p>
      </div>

      <!-- Login Card -->
      <div class="card">
        <h2 class="h2" style="margin-bottom: 6px;">Sign In</h2>
        <p class="body-text muted" style="margin-bottom: 20px;">Enter your credentials to access your portal</p>

        <!-- Alert Notification -->
        <div id="loginAlert" class="alert-banner"></div>

        <form id="loginForm" novalidate>
          
          <!-- Contact Info Field -->
          <div class="form-group">
            <label class="field-label" for="contactInfo">Contact Info / Email / Phone</label>
            <div class="input-wrapper">
              <input 
                type="text" 
                id="contactInfo" 
                name="contactInfo" 
                class="text-field" 
                placeholder="name@example.com or +123456789" 
                required 
                autocomplete="username"
              >
            </div>
            <div id="contactError" class="error-text">Please enter your contact information.</div>
          </div>

          <!-- Password Field -->
          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: baseline;">
              <label class="field-label" for="password">Password</label>
            </div>
            <div class="input-wrapper">
              <input 
                type="password" 
                id="password" 
                name="password" 
                class="password-field" 
                placeholder="••••••••" 
                required 
                autocomplete="current-password"
              >
              <button type="button" id="togglePasswordBtn" class="input-icon-btn" title="Toggle visibility">👁️</button>
            </div>
            <div id="passwordError" class="error-text">Please enter your password.</div>
          </div>

          <!-- Submit Button -->
          <div class="form-group" style="margin-top: 24px;">
            <button type="submit" id="submitBtn" class="btn-primary btn-block">
              <span>Sign In to Portal</span>
            </button>
          </div>
        </form>

        <div class="divider"></div>

        <!-- Signup Prompt -->
        <div style="text-align: center;">
          <p class="body-text">
            Don't have an account yet? 
            <a href="signup.html" style="color: var(--athar-navy-light); font-weight: 700; text-decoration: none;">Create an account</a>
          </p>
        </div>
      </div>

    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast">
    <span id="toastIcon">ℹ️</span>
    <span id="toastMsg" class="body-text"></span>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
